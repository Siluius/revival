<div class="auth-wrapper">
  <mat-card appearance="outlined" class="auth-card">
    <h2>Register</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
      <mat-form-field appearance="outline">
        <mat-label>Display Name</mat-label>
        <input matInput type="text" formControlName="displayName" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" [disabled]="loading() || form.invalid">Create account</button>
      <p class="error" *ngIf="error()">{{ error() }}</p>
      
      <mat-divider class="divider">
        <span class="divider-text">or</span>
      </mat-divider>
      
      <div class="google-login">
        <button mat-stroked-button type="button" (click)="loginWithGoogle()" [disabled]="loading()" class="google-button">
          <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" class="google-logo">
          Continue with Google
        </button>
      </div>
    </form>
    <p>Already have an account? <a routerLink="/login">Login</a></p>
  </mat-card>
</div>
