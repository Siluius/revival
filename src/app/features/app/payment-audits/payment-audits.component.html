<div class="payment-audits-container">
  <mat-toolbar class="audit-toolbar">
    <span>Payment Audits</span>
    <span class="spacer"></span>
    <button mat-stroked-button (click)="exportToCSV()" [disabled]="!canEdit()">
      <mat-icon>download</mat-icon>
      Export to CSV
    </button>
  </mat-toolbar>

  <!-- Daily Report Controls -->
  <div class="audit-controls" *ngIf="selectedTab() === 0">
    <mat-form-field appearance="outline" class="date-picker">
      <mat-label>Select Date</mat-label>
      <input matInput [matDatepicker]="picker" [value]="selectedDate()" (dateChange)="onDateChange($event)">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <button mat-stroked-button (click)="goToToday()">
      <mat-icon>today</mat-icon>
      Today
    </button>

    <button mat-stroked-button (click)="goToYesterday()">
      <mat-icon>yesterday</mat-icon>
      Yesterday
    </button>
  </div>

  <!-- Monthly Report Controls -->
  <div class="audit-controls" *ngIf="selectedTab() === 1">
    <mat-form-field appearance="outline" class="month-picker">
      <mat-label>Select Month</mat-label>
      <input matInput [matDatepicker]="monthPicker" [value]="selectedMonth()" (dateChange)="onMonthChange($event)">
      <mat-datepicker-toggle matSuffix [for]="monthPicker"></mat-datepicker-toggle>
      <mat-datepicker #monthPicker startView="year" [startAt]="selectedMonth()"></mat-datepicker>
    </mat-form-field>

    <button mat-stroked-button (click)="goToPreviousMonth()">
      <mat-icon>chevron_left</mat-icon>
      Previous
    </button>

    <button mat-stroked-button (click)="goToCurrentMonth()">
      <mat-icon>today</mat-icon>
      Current Month
    </button>

    <button mat-stroked-button (click)="goToNextMonth()">
      <mat-icon>chevron_right</mat-icon>
      Next
    </button>
  </div>

      <mat-tab-group [selectedIndex]="selectedTab()" (selectedIndexChange)="selectedTab.set($event)">
        <mat-tab label="Daily Report">
          <app-payment-audits-daily [selectedDate]="validSelectedDate" [companyId]="companyId()"></app-payment-audits-daily>
        </mat-tab>
        <mat-tab label="Monthly Report">
          <app-payment-audits-monthly 
            [selectedDate]="validSelectedMonth" 
            [companyId]="companyId()"
            (dateSelected)="onDateSelected($event)">
          </app-payment-audits-monthly>
        </mat-tab>
      </mat-tab-group>
</div>
