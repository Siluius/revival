<div class="row">
  <mat-card class="w-25" style="padding: 24px; margin: 8px;">
    <h3 style="margin: 0 0 16px 0; color: #1976d2;">Events</h3>
    <div style="font-size: 2rem; font-weight: bold; color: #333;">{{ totalEvents }}</div>
  </mat-card>
  <mat-card class="w-25" style="padding: 24px; margin: 8px;">
    <h3 style="margin: 0 0 16px 0; color: #1976d2;">Attendants</h3>
    <div style="font-size: 2rem; font-weight: bold; color: #333;">{{ totalAttendants }}</div>
  </mat-card>
  <mat-card class="w-25" style="padding: 24px; margin: 8px;">
    <h3 style="margin: 0 0 16px 0; color: #1976d2;">Payments</h3>
    <div style="font-size: 2rem; font-weight: bold; color: #333;">{{ totalPayments }}</div>
  </mat-card>
</div>

<div class="row">
  <mat-card appearance="outlined" class="w-50" style="margin-top:16px;">
    <h3>Attendants by Status per Event</h3>
    <div #chart style="width: 100%; height: 400px;"></div>

    <table mat-table [dataSource]="statusTableRows()" class="mat-elevation-z1" style="margin-top: 16px;">
      <ng-container matColumnDef="event">
        <th mat-header-cell *matHeaderCellDef>Event</th>
        <td mat-cell *matCellDef="let row">{{ row.event }}</td>
      </ng-container>
      <ng-container matColumnDef="unpaid">
        <th mat-header-cell *matHeaderCellDef>Unpaid</th>
        <td mat-cell *matCellDef="let row">{{ row.unpaid }}</td>
      </ng-container>
      <ng-container matColumnDef="partial">
        <th mat-header-cell *matHeaderCellDef>Partial</th>
        <td mat-cell *matCellDef="let row">{{ row.partial }}</td>
      </ng-container>
      <ng-container matColumnDef="paid">
        <th mat-header-cell *matHeaderCellDef>Paid</th>
        <td mat-cell *matCellDef="let row">{{ row.paid }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['event','unpaid','partial','paid']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['event','unpaid','partial','paid']"></tr>
    </table>
  </mat-card>

  <mat-card appearance="outlined" class="w-50" style="margin-top:16px; margin-left:16px;">
    <h3>T-Shirt Size Distribution</h3>
    <div #tshirtChart style="width: 100%; height: 400px;"></div>
  </mat-card>
</div>

<div class="row">
  <mat-card appearance="outlined" class="w-100" style="margin-top:16px;">
    <h3>Financial Status per Event</h3>
    <div #financialChart style="width: 100%; height: 400px;"></div>
  </mat-card>
</div>
